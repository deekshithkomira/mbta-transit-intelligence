<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Short-Hop</title>
<meta name="description" content="Short-Hop — a concept rider app for distance-based subway fares on Boston's MBTA, built on Washington Metrorail's fare model.">
<meta name="theme-color" content="#13203a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="phone">
  <header class="bar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#13203a"/>
        <path d="M9 27c4-10 9-13 13-13" stroke="#ffc72c" stroke-width="3.4" fill="none" stroke-linecap="round"/>
        <circle cx="9" cy="27" r="3.6" fill="#3ecf8e"/><circle cx="29" cy="14" r="3.6" fill="#ffc72c"/></svg>
      <div><b>Short-Hop</b><small>Pay by distance · Boston subway</small></div>
    </div>
    <button class="chip" id="balance-chip" data-go="wallet" aria-label="Wallet balance"></button>
  </header>
  <div class="concept">Concept app · demo money only · not affiliated with the MBTA</div>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" role="tablist">
    <button data-go="trip" role="tab"><svg viewBox="0 0 24 24"><path d="M4 18l6-12 4 8 2-4 4 8z"/></svg>Trip</button>
    <button data-go="ride" role="tab"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M8 21l2-4m6 4l-2-4M8 12h.01M16 12h.01"/></svg>Ride</button>
    <button data-go="wallet" role="tab"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2M3 9h18"/></svg>Wallet</button>
    <button data-go="history" role="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>History</button>
    <button data-go="fares" role="tab"><svg viewBox="0 0 24 24"><path d="M5 20V10m7 10V4m7 16v-7"/></svg>Fares</button>
  </nav>
</div>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../vendor/leaflet.js"></script>
<script src="../vendor/qrcode.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
